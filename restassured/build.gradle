plugins {
    id 'java'
    id 'org.springframework.boot' version "$springBootVersion"
    id 'io.spring.dependency-management' version "$springDependencyManagementVersion"
    id 'io.qameta.allure' version "$allurePlugin"

}

group = 'ru.kuzya'
version = '0.0.1-SNAPSHOT'
description = 'restassured'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

//allure {
//    version = '2.26.0'
//    autoconfigure = true
//    aspectjweaver = true
//
//    useJUnit5 {
//        version = '2.26.0'
//    }
//}

repositories {
    mavenCentral()
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile){
    options.encoding = 'UTF-8'
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation "io.qameta.allure:allure-junit5:$allureJunit5Version"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    testImplementation "com.codeborne:selenide:$selenideVersion"
    testImplementation "io.github.bonigarcia:webdrivermanager:$webDriverManagerVersion"

    testImplementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.25.0'
    implementation("org.seleniumhq.selenium:selenium-java:4.25.0")
    testImplementation "org.seleniumhq.selenium:selenium-devtools-v144:4.40.0" // Соответствует версии Chrome


    // Allure
    testImplementation "io.qameta.allure:allure-junit5:$allureJunit5Version"
    testImplementation "io.qameta.allure:allure-rest-assured:$allureJunit5Version"
    testImplementation "io.qameta.allure:allure-selenide:$allureJunit5Version"
    implementation("io.qameta.allure:allure-attachments:$allureJunit5Version")
    // Тестирование верстки Selenide
    testImplementation 'com.github.romankh3:image-comparison:4.4.0'

}

def apiTest = tasks.register("apiTests", Test) {
    useJUnitPlatform {
        includeTags "API"
    }
}

def uiTest = tasks.register("uiTests", Test) {
    useJUnitPlatform {
        includeTags "UI"
    }
//    onlyIf { false }  // Не запускать, если нет UI тестов
}


tasks.named('test') {
    useJUnitPlatform()
    // Включить параллельное выполнение
    systemProperties = [
            'junit.jupiter.execution.parallel.enabled': 'true',
            'junit.jupiter.execution.parallel.config.fixed.parallelism': '2',
            'allure.results.directory': 'build/allure-results'
    ]

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
    // Создаем папку для результатов Allure
    // Добавьте этот блок для диагностики
    doFirst {
        println "=== GRADLE TEST DIAGNOSTICS ==="
        println "Project dir: ${project.projectDir}"
        println "Build dir: ${buildDir}"
        println "Allure results dir: ${buildDir}/allure-results"
        println "System properties: ${systemProperties}"

        // Создаем папку и проверяем права
        def allureDir = file("${buildDir}/allure-results")
        if (!allureDir.exists()) {
            println "Creating allure results directory: ${allureDir}"
            allureDir.mkdirs()
        }
        println "Allure directory exists: ${allureDir.exists()}, writable: ${allureDir.canWrite()}"
    }

    doLast {
        println "=== AFTER TEST ==="
        def allureDir = file("${buildDir}/allure-results")
        if (allureDir.exists()) {
            println "Allure results directory contents:"
            allureDir.eachFile { f ->
                println "  - ${f.name} (${f.size()} bytes)"
            }
        } else {
            println "Allure results directory does NOT exist!"
        }
    }
// Добавляем отчеты Allure после тестов
    finalizedBy 'allureReport'
}
